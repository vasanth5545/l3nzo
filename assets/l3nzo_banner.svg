<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGradL3nzo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="l3nzoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #FFFFFF;
        letter-spacing: 6px;
      }
      .brand-dot {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif;
        font-weight: 900;
        font-size: 72px;
        fill: url(#brandGrad);
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: #94A3B8;
        letter-spacing: 1.5px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #64748B;
        letter-spacing: 1px;
      }
      .badge-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #F1F5F9;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Border Card -->
  <rect x="2" y="2" width="956" height="256" rx="16" fill="url(#bgGradL3nzo)" stroke="#1E293B" stroke-width="2"/>

  <!-- Glow Accents -->
  <circle cx="200" cy="80" r="100" fill="#6366F1" opacity="0.14" filter="url(#l3nzoGlow)"/>
  <circle cx="800" cy="150" r="110" fill="#EC4899" opacity="0.10" filter="url(#l3nzoGlow)"/>

  <!-- Tech Accent Lines -->
  <path d="M 60 210 L 900 210" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 60 210 L 320 210" stroke="url(#cyanGrad)" stroke-width="2.5"/>

  <!-- Logo Icon Anchor -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="#1E1B4B" stroke="#6366F1" stroke-width="2"/>
    <!-- Camera/Lens Glyph -->
    <circle cx="35" cy="35" r="18" stroke="#818CF8" stroke-width="3" fill="none"/>
    <circle cx="35" cy="35" r="8" fill="#A5B4FC"/>
    <circle cx="48" cy="22" r="3" fill="#EC4899"/>
  </g>

  <!-- Brand Title -->
  <text x="150" y="100" class="brand-title">L3NZO<tspan class="brand-dot">.</tspan></text>
  <text x="154" y="138" class="brand-subtitle">Next-Gen Studio OS &amp; Real-Time Client Proofing Engine</text>
  <text x="154" y="165" class="tagline">Engineered for high-volume wedding photographers, creative studios &amp; agencies</text>

  <!-- Feature Pills -->
  <g transform="translate(154, 180)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" class="badge-txt" fill="#38BDF8">⚡ 50ms RTDB SYNC</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="145" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" class="badge-txt" fill="#818CF8">🔒 ZERO-LEAK SQLITE</text>

    <!-- Pill 3 -->
    <rect x="295" y="0" width="155" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" class="badge-txt" fill="#34D399">📁 1-CLICK AUTO-SORT</text>

    <!-- Pill 4 -->
    <rect x="460" y="0" width="170" height="28" rx="14" fill="#312E81" stroke="#4F46E5" stroke-width="1"/>
    <text x="14" y="18" class="badge-txt" fill="#C7D2FE">🏛️ GOVT MSME CERTIFIED</text>
  </g>
</svg>
